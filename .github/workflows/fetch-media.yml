name: Fetch media

# Add lines to media-manifest.txt as  url | path/in/repo  and push.
# This workflow downloads each file that isn't already in the repo,
# commits it, and then kicks off the normal site deploy.

on:
  push:
    paths: ['media-manifest.txt']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: media
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files listed in the manifest
        run: |
          while IFS='|' read -r url dest; do
            url="$(echo "$url" | xargs)"; dest="$(echo "$dest" | xargs)"
            [ -z "$url" ] && continue
            case "$url" in \#*) continue;; esac
            if [ -f "$dest" ]; then echo "skip $dest (exists)"; continue; fi
            mkdir -p "$(dirname "$dest")"
            echo "fetch $dest"
            curl -fsSL --retry 3 -A "Mozilla/5.0" "$url" -o "$dest"
          done < media-manifest.txt
      - name: Commit downloaded files
        id: commit
        run: |
          git config user.name "media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add media from manifest"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
