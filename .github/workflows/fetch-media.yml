name: Fetch media

# Add lines to media-manifest.txt as  url|path/in/repo  and push.
# This workflow downloads each file that isn't already in the repo,
# commits it, and then rebuilds the site.

on:
  push:
    paths: ['media-manifest.txt']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download files listed in the manifest
        run: |
          while IFS='|' read -r url dest; do
            url="$(echo "$url" | xargs)"; dest="$(echo "$dest" | xargs)"
            [ -z "$url" ] && continue
            case "$url" in \#*) continue;; esac
            if [ -f "$dest" ]; then echo "skip $dest (exists)"; continue; fi
            mkdir -p "$(dirname "$dest")"
            echo "fetch $dest"
            curl -fsSL --retry 3 -A "Mozilla/5.0" "$url" -o "$dest"
          done < media-manifest.txt
      - name: Commit downloaded files
        run: |
          git config user.name "media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add media from manifest"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
