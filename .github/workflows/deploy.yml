name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Render resume/index.html to the PDF the site links to
        run: |
          mkdir -p public/resume
          google-chrome --headless=new --disable-gpu --no-sandbox \
            --no-pdf-header-footer \
            --print-to-pdf="$PWD/public/resume/Matthew_Foote_Resume.pdf" \
            "file://$PWD/resume/index.html"
          ls -la public/resume
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
